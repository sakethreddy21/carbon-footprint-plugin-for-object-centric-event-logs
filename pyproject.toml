[project]
name = "ocel-carbon"
version = "0.1.0"
description = "Carbon footprint analysis for object-centric event logs: an Ocelescope plugin"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "ocelescope>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocel_carbon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
